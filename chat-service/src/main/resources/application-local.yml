spring:
  config:
    activate:
      on-profile: local

  scheduling:
    enable: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${CHAT_DB}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO}

  sql:
    init:
      mode: ${SQL_INIT_MODE}
      data-locations: classpath:data.sql

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      auto-offset-reset: latest
    listener:
      ack-mode: record
      type: single
      concurrency: ${KAFKA_LISTENER_CONCURRENCY}

logging:
  level:
    root: INFO
    io.playground: ${LOGGING_LEVEL_PROJECT}

    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL}
    org.hibernate.orm.jdbc.bind: ${LOGGING_LEVEL_HIBERNATE_JDBC}

    org.apache.kafka: ${LOGGING_LEVEL_KAFKA}
    org.springframework.kafka: ${LOGGING_LEVEL_SPRING_KAFKA}

management:
  endpoints:
    web:
      exposure:
        include: health

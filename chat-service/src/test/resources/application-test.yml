#
#    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL}
#    org.hibernate.orm.jdbc.bind: ${LOGGING_LEVEL_HIBERNATE_JDBC}
#
#    org.apache.kafka: ${LOGGING_LEVEL_KAFKA}
#    org.springframework.kafka: ${LOGGING_LEVEL_SPRING_KAFKA}


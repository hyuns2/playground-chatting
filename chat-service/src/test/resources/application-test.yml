spring:
  config:
    activate:
      on-profile: test

  scheduling:
    enable: false

  jpa:
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: never

  kafka:
    bootstrap-servers: localhost:19094
    consumer:
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      type: single
      concurrency: 1

logging:
  level:
    root: INFO

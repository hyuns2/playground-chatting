spring:
  config:
    activate:
      on-profile: secret

auth:
  jwt:
    grant-type: ${AUTH_JWT_GRANT-TYPE}
    secret-key: ${AUTH_JWT_SECRET-KEY}
    access-exp: ${AUTH_JWT_ACCESS-EXP}
    refresh-exp: ${AUTH_JWT_REFRESH-EXP}
    token-type-claim: type
    device-id-claim: deviceId
    authorities-claim: authorities
